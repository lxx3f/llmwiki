{% extends "base.html" %}
{% block title %}审核 {{ branch }} — LLM Wiki{% endblock %}

{% block head %}
<style>
    .diff-add { background: #d4edda; color: #155724; }
    .diff-del { background: #f8d7da; color: #721c24; }
    .diff-hdr { color: #0366d6; }
    .diff-file { color: #6f42c1; font-weight: bold; }
    .diff-hunk { color: #6a737d; }
</style>
{% endblock %}

{% block content %}
<div class="p-6">
    <div class="flex items-center justify-between mb-4">
        <div>
            <a href="/review" class="text-sm text-muted hover:underline">← 返回列表</a>
            <h1 class="text-2xl font-bold mt-1">{{ branch }}</h1>
        </div>
        <div class="flex gap-2">
            <form method="POST" action="/review/{{ branch }}/approve" class="inline"
                  onsubmit="return confirm('确定要合并 {{ branch }}？')">
                <button class="px-4 py-2 bg-green-600 text-white rounded text-sm hover:bg-green-700 transition-colors">
                    批准合并
                </button>
            </form>
            <form method="POST" action="/review/{{ branch }}/reject" class="inline"
                  onsubmit="return confirm('确定要拒绝 {{ branch }}？此分支将被删除。')">
                <button class="px-4 py-2 bg-red-500 text-white rounded text-sm hover:bg-red-600 transition-colors">
                    拒绝
                </button>
            </form>
        </div>
    </div>

    <div class="card p-4 mb-4">
        <p class="text-sm text-muted">Commit:</p>
        <pre class="text-sm">{{ message }}</pre>
    </div>

    {% if stat %}
    <div class="card p-4 mb-4">
        <p class="text-sm text-muted mb-2">变更文件:</p>
        <pre class="text-sm">{{ stat }}</pre>
    </div>
    {% endif %}

    <div class="card p-4">
        <p class="text-sm text-muted mb-2">Diff:</p>
        <pre class="text-xs leading-relaxed overflow-x-auto">{{ diff }}</pre>
    </div>
</div>
{% endblock %}
