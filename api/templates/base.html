<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LLM Wiki{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.0/dist/cdn.min.js" defer></script>
    <style>
        /* Tailwind CDN custom colors — Typewriter palette */
        :root {
            --tw-paper: 44 40% 96%;
            --tw-card: 44 30% 99%;
            --tw-sidebar: 42 25% 93%;
            --tw-border: 40 15% 87%;
            --tw-text: 0 0% 5%;
            --tw-text-muted: 0 0% 35%;
            --tw-accent: 129 32% 47%;
            --tw-accent-hover: 129 32% 38%;
            --tw-input: 40 20% 97%;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen">
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="app-sidebar sidebar border-default">
            <div class="sidebar-header border-default">
                <a href="/" class="text-lg font-bold hover:opacity-75 transition-opacity logo">LLM Wiki</a>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item {% if active_page == 'home' %}active{% endif %}">
                    📄 知识库
                </a>
                <a href="/tags" class="nav-item {% if active_page == 'tags' %}active{% endif %}">
                    🏷️ 标签
                </a>
                <a href="/extractions" class="nav-item {% if active_page == 'extractions' %}active{% endif %}">
                    ✨ 待提取
                    <span id="pending-count" class="ml-auto text-xs text-white px-1.5 py-0.5 rounded-full hidden badge-count">0</span>
                </a>
                <a href="/qa" class="nav-item {% if active_page == 'qa' %}active{% endif %}">
                    💬 问答
                </a>
                <a href="/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
                    ⚙️ 设置
                </a>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="app-main">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast container -->
    <div id="toast" class="fixed bottom-4 right-4 z-50 space-y-2" x-data x-init="window.toast = (msg, type='info') => { const el = document.createElement('div'); el.className = `px-4 py-2 rounded text-sm shadow-lg transition-all animate-in toast-${type}`; el.textContent = msg; $el.appendChild(el); setTimeout(() => el.remove(), 3000); }"></div>

    {% block scripts %}{% endblock %}
</body>
</html>
