{% extends "base.html" %}
{% block title %}标签管理 - LLM Wiki{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto p-8" x-data="tagsPage()" x-init="init()">
    <h1 class="text-2xl font-bold mb-6 page-title">标签管理</h1>

    <form @submit.prevent="createTag" class="flex gap-2 mb-8">
        <input type="text" x-model="newTagName" placeholder="新标签名称" required class="input max-w-xs">
        <input type="text" x-model="newTagColor" placeholder="颜色（可选）" class="input w-24">
        <button type="submit" class="btn btn-primary">创建</button>
    </form>

    <div class="grid gap-3">
        <template x-for="tag in tags" :key="tag.id">
            <div class="card flex items-center justify-between p-3">
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 rounded-full" :style="'background:' + (tag.color || '#6b7280')"></span>
                    <span class="page-title" x-text="tag.name"></span>
                </div>
                <button @click="deleteTag(tag.id)" class="btn btn-ghost text-xs">删除</button>
            </div>
        </template>
        <p x-show="tags.length === 0" class="text-placeholder">暂无标签</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function tagsPage() {
    return {
        tags: [],
        newTagName: '',
        newTagColor: '',
        async init() {
            const resp = await fetch('/v1/tags');
            this.tags = await resp.json();
        },
        async createTag() {
            if (!this.newTagName.trim()) return;
            const resp = await fetch('/v1/tags', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: this.newTagName.trim(), color: this.newTagColor || null}),
            });
            if (resp.ok) {
                const tag = await resp.json();
                this.tags.push(tag);
                this.newTagName = '';
                this.newTagColor = '';
            } else {
                window.toast((await resp.json()).detail || '创建失败', 'error');
            }
        },
        async deleteTag(id) {
            if (!confirm('确定删除？')) return;
            await fetch(`/v1/tags/${id}`, {method: 'DELETE'});
            this.tags = this.tags.filter(t => t.id !== id);
        },
    };
}
</script>
{% endblock %}
