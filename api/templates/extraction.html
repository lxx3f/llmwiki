{% extends "base.html" %}
{% block title %}待提取 - LLM Wiki{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto p-8" x-data="extractionPage()" x-init="init()">
    <h1 class="text-2xl font-bold mb-6 page-title">知识提取队列</h1>

    <div class="flex gap-2 mb-6">
        <button @click="filter='all'" :class="filter==='all' ? 'bg-gray-200 text-gray-800 font-semibold' : 'text-gray-400 hover:text-gray-600'"
                class="btn btn-tag">全部</button>
        <button @click="filter='pending'" :class="filter==='pending' ? 'btn-tag-pending' : ''"
                class="btn btn-tag">待处理</button>
        <button @click="filter='approved'" :class="filter==='approved' ? 'btn-tag-approved' : ''"
                class="btn btn-tag">已批准</button>
        <button @click="filter='rejected'" :class="filter==='rejected' ? 'btn-tag-rejected' : ''"
                class="btn btn-tag">已拒绝</button>
    </div>

    <div class="grid gap-4">
        <template x-for="task in filteredTasks" :key="task.id">
            <div class="card p-4">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-3">
                        <span class="font-medium page-title" x-text="task.document_id?.substring(0,8)+'...'"></span>
                        <span :class="statusBadge(task.status)" x-text="statusLabel(task.status)" class="badge"></span>
                    </div>
                    <span class="text-xs text-placeholder" x-text="new Date(task.created_at).toLocaleDateString('zh-CN')"></span>
                </div>
                <template x-if="task.proposed_content">
                    <div class="text-sm rounded-lg p-3 mb-3 max-h-32 overflow-y-auto extract-preview" x-text="task.proposed_content"></div>
                </template>
                <template x-if="task.proposed_tags">
                    <div class="flex gap-1 mb-2">
                        <template x-for="tag in task.proposed_tags">
                            <span class="tag" x-text="tag"></span>
                        </template>
                    </div>
                </template>
                <template x-if="task.status === 'pending'">
                    <a :href="'/extractions/' + task.id" class="btn btn-primary text-sm">审核</a>
                </template>
            </div>
        </template>
        <p x-show="filteredTasks.length === 0" class="text-placeholder" x-text="filter==='pending' ? '没有待处理的任务' : '没有任务'"></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function extractionPage() {
    return {
        tasks: [],
        filter: 'all',
        async init() {
            const resp = await fetch('/v1/extractions');
            this.tasks = await resp.json();
        },
        get filteredTasks() {
            return this.filter === 'all' ? this.tasks : this.tasks.filter(t => t.status === this.filter);
        },
        statusLabel(s) { return {pending:'待处理',approved:'已批准',rejected:'已拒绝'}[s]||s; },
        statusBadge(s) {
            return {pending:'badge-pending',approved:'badge-approved',rejected:'badge-rejected'}[s]||'';
        },
    };
}
</script>
{% endblock %}
