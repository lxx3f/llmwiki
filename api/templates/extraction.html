{% extends "base.html" %}
{% block title %}待提取 - LLM Wiki{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto p-8" x-data="extractionPage()" x-init="init()">
    <h1 class="text-2xl font-bold mb-6">知识提取队列</h1>

    <div class="flex gap-2 mb-6">
        <button @click="filter='all'" :class="filter==='all' ? 'bg-neutral-700 text-white' : 'text-neutral-500 hover:text-white'"
                class="px-3 py-1 rounded text-sm transition-colors">全部</button>
        <button @click="filter='pending'" :class="filter==='pending' ? 'bg-yellow-600 text-white' : 'text-neutral-500 hover:text-white'"
                class="px-3 py-1 rounded text-sm transition-colors">待处理</button>
        <button @click="filter='approved'" :class="filter==='approved' ? 'bg-green-600 text-white' : 'text-neutral-500 hover:text-white'"
                class="px-3 py-1 rounded text-sm transition-colors">已批准</button>
        <button @click="filter='rejected'" :class="filter==='rejected' ? 'bg-red-600 text-white' : 'text-neutral-500 hover:text-white'"
                class="px-3 py-1 rounded text-sm transition-colors">已拒绝</button>
    </div>

    <div class="grid gap-4">
        <template x-for="task in filteredTasks" :key="task.id">
            <div class="p-4 bg-neutral-900 border border-neutral-800 rounded-xl">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-3">
                        <span class="text-white font-medium" x-text="task.document_id?.substring(0,8)+'...'"></span>
                        <span :class="statusBadge(task.status)" x-text="statusLabel(task.status)"
                              class="px-2 py-0.5 rounded text-xs font-medium"></span>
                    </div>
                    <span class="text-xs text-neutral-600" x-text="new Date(task.created_at).toLocaleDateString('zh-CN')"></span>
                </div>
                <template x-if="task.proposed_content">
                    <div class="text-sm text-neutral-400 bg-neutral-800 rounded-lg p-3 mb-3 max-h-32 overflow-y-auto" x-text="task.proposed_content"></div>
                </template>
                <template x-if="task.proposed_tags">
                    <div class="flex gap-1 mb-2">
                        <template x-for="tag in task.proposed_tags">
                            <span class="px-2 py-0.5 bg-neutral-800 rounded-full text-xs text-neutral-400" x-text="tag"></span>
                        </template>
                    </div>
                </template>
                <template x-if="task.status === 'pending'">
                    <a :href="'/extractions/' + task.id" class="inline-block px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm transition-colors">审核</a>
                </template>
            </div>
        </template>
        <p x-show="filteredTasks.length === 0" class="text-neutral-600" x-text="filter==='pending' ? '没有待处理的任务' : '没有任务'"></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function extractionPage() {
    return {
        tasks: [],
        filter: 'all',
        async init() {
            const resp = await fetch('/v1/extractions');
            this.tasks = await resp.json();
        },
        get filteredTasks() {
            return this.filter === 'all' ? this.tasks : this.tasks.filter(t => t.status === this.filter);
        },
        statusLabel(s) { return {pending:'待处理',approved:'已批准',rejected:'已拒绝'}[s]||s; },
        statusBadge(s) {
            return {pending:'bg-yellow-600/20 text-yellow-400',approved:'bg-green-600/20 text-green-400',rejected:'bg-red-600/20 text-red-400'}[s]||'';
        },
    };
}
</script>
{% endblock %}
