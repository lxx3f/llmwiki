{% extends "base.html" %}
{% block title %}问答 - LLM Wiki{% endblock %}
{% block content %}
<div class="h-full flex flex-col" x-data="qaPage()">
    <!-- Header -->
    <div class="p-4 border-b border-neutral-800 flex items-center gap-3">
        <select x-model="selectedKB" class="px-3 py-1.5 bg-neutral-800 border border-neutral-700 rounded-lg text-white text-sm focus:outline-none">
            <option value="">选择知识库</option>
            <template x-for="kb in kbs" :key="kb.id">
                <option :value="kb.id" x-text="kb.name"></option>
            </template>
        </select>
        <span class="text-xs text-neutral-500">选择知识库后开始提问，系统将在 wiki 中搜索相关内容</span>
    </div>

    <!-- Messages -->
    <div id="qa-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="text-center text-neutral-600 py-8">
            <p>基于 Wiki 知识库的智能问答</p>
            <p class="text-sm mt-1">选择知识库后输入问题</p>
        </div>
    </div>

    <!-- Input -->
    <div class="p-4 border-t border-neutral-800">
        <form @submit.prevent="ask" class="flex gap-3">
            <input type="text" x-model="question" placeholder="向 wiki 提问..."
                   :disabled="!selectedKB"
                   class="flex-1 px-4 py-2.5 bg-neutral-800 border border-neutral-700 rounded-xl text-white focus:outline-none focus:border-blue-500 disabled:opacity-50">
            <button type="submit" :disabled="!selectedKB || submitting"
                    class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-xl text-sm font-medium transition-colors">
                发送
            </button>
        </form>
        <p class="text-xs text-neutral-600 mt-2">回答基于 wiki 搜索结果生成。有价值的洞察可保存为 wiki 页面。</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function qaPage() {
    return {
        kbs: [],
        selectedKB: '',
        question: '',
        submitting: false,
        async init() {
            const resp = await fetch('/v1/knowledge-bases');
            this.kbs = await resp.json();
            if (this.kbs.length > 0) this.selectedKB = this.kbs[0].id;
        },
        async ask() {
            if (!this.question.trim() || !this.selectedKB) return;
            this.submitting = true;
            const messages = document.getElementById('qa-messages');
            const q = this.question;
            this.question = '';

            // Add user message
            messages.innerHTML += `<div class="flex justify-end"><div class="bg-blue-600 text-white px-4 py-2 rounded-xl max-w-2xl text-sm">${q}</div></div>`;

            // Search for relevant chunks
            try {
                const resp = await fetch(`/v1/knowledge-bases/${this.selectedKB}/documents`);
                const docs = await resp.json();

                // Simple answer based on available content
                let answer = `在知识库中搜索到 **${docs.length}** 个文档。`;

                // Search chunks
                const chunksResp = await fetch(`/v1/search/chunks?kb_id=${this.selectedKB}&q=${encodeURIComponent(q)}`);
                if (chunksResp.ok) {
                    const chunks = await chunksResp.json();
                    if (chunks.length > 0) {
                        answer += `\n\n找到 **${chunks.length}** 个相关内容片段。功能开发中，暂时展示搜索结果。\n\n`;
                        for (const c of chunks.slice(0, 5)) {
                            answer += `\n> ${c.content.substring(0, 200)}...\n`;
                        }
                    }
                }

                messages.innerHTML += `<div class="flex justify-start"><div class="bg-neutral-800 text-neutral-200 px-4 py-2 rounded-xl max-w-2xl text-sm whitespace-pre-wrap">${answer}</div></div>`;
            } catch (err) {
                messages.innerHTML += `<div class="flex justify-start"><div class="bg-red-900/50 text-red-300 px-4 py-2 rounded-xl text-sm">搜索出错: ${err.message}</div></div>`;
            }
            messages.scrollTop = messages.scrollHeight;
            this.submitting = false;
        },
    };
}
</script>
{% endblock %}
