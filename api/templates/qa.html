{% extends "base.html" %}
{% block title %}问答 - LLM Wiki{% endblock %}
{% block content %}
<div class="h-full flex flex-col" x-data="qaPage()">
    <div class="p-4 border-b flex items-center gap-3 border-default">
        <select x-model="selectedKB" class="input" style="width:auto;min-width:180px">
            <option value="">选择知识库</option>
            <template x-for="kb in kbs" :key="kb.id">
                <option :value="kb.id" x-text="kb.name"></option>
            </template>
        </select>
        <span class="text-xs text-muted">选择知识库后开始提问，系统将在 wiki 中搜索相关内容</span>
    </div>

    <div id="qa-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="text-center py-8 text-placeholder">
            <p>基于 Wiki 知识库的智能问答</p>
            <p class="text-sm mt-1">选择知识库后输入问题</p>
        </div>
    </div>

    <div class="p-4 border-t border-default">
        <form @submit.prevent="ask" class="flex gap-3">
            <input type="text" x-model="question" placeholder="向 wiki 提问..."
                   :disabled="!selectedKB" class="input flex-1 rounded-xl">
            <button type="submit" :disabled="!selectedKB || submitting" class="btn btn-primary rounded-xl" style="padding-left:1.5rem;padding-right:1.5rem">
                发送
            </button>
        </form>
        <p class="text-xs mt-2 text-placeholder">回答基于 wiki 搜索结果生成。有价值的洞察可保存为 wiki 页面。</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function qaPage() {
    return {
        kbs: [],
        selectedKB: '',
        question: '',
        submitting: false,
        async init() {
            const resp = await fetch('/v1/knowledge-bases');
            this.kbs = await resp.json();
            if (this.kbs.length > 0) this.selectedKB = this.kbs[0].id;
        },
        async ask() {
            if (!this.question.trim() || !this.selectedKB) return;
            this.submitting = true;
            const messages = document.getElementById('qa-messages');
            const q = this.question;
            this.question = '';

            messages.innerHTML += `<div class="flex justify-end"><div class="chat-user">${q}</div></div>`;

            try {
                const resp = await fetch(`/v1/knowledge-bases/${this.selectedKB}/documents`);
                const docs = await resp.json();
                let answer = `在知识库中搜索到 **${docs.length}** 个文档。`;

                const chunksResp = await fetch(`/v1/search/chunks?kb_id=${this.selectedKB}&q=${encodeURIComponent(q)}`);
                if (chunksResp.ok) {
                    const chunks = await chunksResp.json();
                    if (chunks.length > 0) {
                        answer += `\n\n找到 **${chunks.length}** 个相关内容片段。功能开发中，暂时展示搜索结果。\n\n`;
                        for (const c of chunks.slice(0, 5)) {
                            answer += `\n> ${c.content.substring(0, 200)}...\n`;
                        }
                    }
                }

                messages.innerHTML += `<div class="flex justify-start"><div class="chat-bot">${answer.replace(/\n/g,'<br>')}</div></div>`;
            } catch (err) {
                messages.innerHTML += `<div class="flex justify-start"><div class="chat-error">搜索出错: ${err.message}</div></div>`;
            }
            messages.scrollTop = messages.scrollHeight;
            this.submitting = false;
        },
    };
}
</script>
{% endblock %}
