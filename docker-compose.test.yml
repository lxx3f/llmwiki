services:
  db-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: llmwiki_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./supabase/migrations:/docker-entrypoint-initdb.d
